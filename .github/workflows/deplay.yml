name: Build and Deploy

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ========================================
  # BUILD
  # ========================================

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}


      - name: Build image
        run: |
          docker build \
            --build-arg VITE_API_URL_PROD=http://localhost:8089/api/v1 \
            -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            .


      - name: Push image
        run: |
          docker push \
            $REGISTRY/$IMAGE_NAME:${{ github.sha }}