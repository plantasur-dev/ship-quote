name: Test, Build and Deploy shipQuote

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  release:
    types:
      - published

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  test:
    name: Run Tests API shipQuote
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DEFAULT_COUNTRY: ES
          MONGODB_URI_TEST: mongodb://localhost:27017/ship_quote_test


  build:
    name: Build Docker
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build image docker shipQuote
        run: |
          docker build \
            --build-arg VITE_API_URL_PROD=http://81.46.212.167:8089/api/v1 \
            --build-arg VITE_API_URL_LOG=http://81.46.212.167:3001 \
            -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            .

      - name: Push image docker shipQuote
        run: |
          docker push \
            $REGISTRY/$IMAGE_NAME:${{ github.sha }}

  
  deploy:
    name: Deploy Docker shipQuote
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Copy deployment files
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml,infra/"
          target: "opt/ship-quote"


      - name: Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            cd opt/ship-quote

            cat > .env << 'EOF'
            ${{ secrets.PRODUCTION_ENV }}
            EOF

            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io \
              --username "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            export IMAGE_TAG=${{ github.sha }}

            docker compose \
              -f docker-compose.prod.yml \
              -p ship-quote-app \
              pull

            docker compose \
              -f docker-compose.prod.yml \
              -p ship-quote-app \
              up -d

            echo "Cleaning unused images..."